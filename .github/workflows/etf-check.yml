name: ETF Monitor

on:
  schedule:
    - cron: '0 7-17 * * 1-5'   # Stündlich Mo–Fr zwischen 7–17 Uhr UTC (= 9–19 Uhr MEZ)
  workflow_dispatch:             # Auch manuell auslösbar

permissions:
  contents: write                # Damit die Action dashboard.json ins Repo schreiben kann

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install requests anthropic

      - name: ETF-Checker ausführen
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MA_THRESHOLD_PCT: '3.0'
          RSI_THRESHOLD:    '38'
        run: python checker/etf_checker.py

      - name: dashboard.json committen und pushen
        run: |
          git config user.name  "ETF Monitor Bot"
          git config user.email "bot@etf-monitor"
          git add docs/dashboard.json
          git diff --cached --quiet || git commit -m "ETF update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
